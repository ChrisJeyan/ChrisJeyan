<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Terminal introducing Chris Jeyan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C6FF0"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="298" rx="14" fill="#0B0E14" stroke="#1E2430" stroke-width="1.5"/>
  <path d="M15 1 H885 A14 14 0 0 1 899 15 V41 H1 V15 A14 14 0 0 1 15 1 Z" fill="#10141C"/>
  <circle cx="28" cy="21" r="5" fill="#3A4150"/>
  <circle cx="46" cy="21" r="5" fill="#3A4150"/>
  <circle cx="64" cy="21" r="5" fill="#3A4150"/>
  <text x="450" y="25" text-anchor="middle" fill="#5B6376" font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12">chris@devbox — zsh</text>

  <g font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace">
    <text x="34" y="90" fill="#5B6376" font-size="16">$ whoami</text>
    <text x="34" y="124" fill="#E7E9EE" font-weight="600" font-size="27">&gt; Chris Jeyan<tspan fill="#7C6FF0">.</tspan></text>

    <text x="34" y="164" fill="#5B6376" font-size="16">$ cat focus.txt</text>
    <text x="34" y="192" fill="#AEB4C2" font-size="15">full-stack developer in Tirunelveli, India,</text>
    <text x="34" y="214" fill="#AEB4C2" font-size="15">building real-time and AI-assisted dev tools.</text>

    <text x="34" y="252" fill="#5B6376" font-size="16">$ <tspan id="cursor" fill="#7C6FF0">_</tspan></text>
  </g>
  <animate xlink:href="#cursor" attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>

  <g stroke="url(#edge)" stroke-width="1.4" fill="none" opacity="0.9">
    <line x1="660" y1="92" x2="742" y2="132" stroke-dasharray="0,120">
      <animate attributeName="stroke-dasharray" from="0,120" to="120,0" dur="1.4s" begin="0.2s" fill="freeze"/>
    </line>
    <line x1="742" y1="132" x2="702" y2="202" stroke-dasharray="0,110">
      <animate attributeName="stroke-dasharray" from="0,110" to="110,0" dur="1.4s" begin="0.5s" fill="freeze"/>
    </line>
    <line x1="742" y1="132" x2="822" y2="150" stroke-dasharray="0,100">
      <animate attributeName="stroke-dasharray" from="0,100" to="100,0" dur="1.4s" begin="0.8s" fill="freeze"/>
    </line>
    <line x1="702" y1="202" x2="800" y2="230" stroke-dasharray="0,120">
      <animate attributeName="stroke-dasharray" from="0,120" to="120,0" dur="1.4s" begin="1.1s" fill="freeze"/>
    </line>
  </g>

  <g fill="#0B0E14" stroke="#7C6FF0" stroke-width="1.6">
    <circle cx="660" cy="92" r="6"/>
    <circle cx="822" cy="150" r="5"/>
    <circle cx="702" cy="202" r="5"/>
    <circle cx="800" cy="230" r="6"/>
  </g>
  <circle cx="742" cy="132" r="7" fill="#0B0E14" stroke="#5EEAD4" stroke-width="1.8"/>
  <circle cx="742" cy="132" r="2.3" fill="#5EEAD4"/>
</svg>
